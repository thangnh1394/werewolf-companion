name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check all packages
        run: npm run type-check

      - name: Run server tests
        run: npm test --workspace=@werewolf/server

      - name: Build client
        run: npm run build --workspace=@werewolf/client
